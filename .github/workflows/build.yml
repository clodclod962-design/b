
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Java source folders
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Preparing project..."

          mkdir -p src/main/java
          mkdir -p src/main/resources/assets/mymod/lang

          # Find Java files and place them according to package declarations.
          while IFS= read -r -d '' file; do

            package_name=$(sed -nE \
              's/^[[:space:]]*package[[:space:]]+([[:alnum:]_.]+)[[:space:]]*;.*/\1/p' \
              "$file" | head -n 1)

            if [ -n "$package_name" ]; then
              package_path="${package_name//.//}"
              destination="src/main/java/$package_path/$(basename "$file")"
            else
              destination="src/main/java/$(basename "$file")"
            fi

            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"

            echo "Prepared: $destination"

          done < <(find . -type f -name '*.java' \
            ! -path './.git/*' \
            ! -path './.gradle/*' \
            ! -path './build/*' \
            ! -path './src/main/java/*' \
            -print0)

          # Copy Fabric resources.
          copy_resource() {
            local name="$1"
            local destination="$2"

            if [ -f "$destination" ]; then
              return
            fi

            local source
            source=$(find . -type f -name "$name" \
              ! -path './.git/*' \
              ! -path './build/*' \
              -print -quit)

            if [ -n "$source" ]; then
              mkdir -p "$(dirname "$destination")"
              cp "$source" "$destination"
              echo "Resource copied: $name"
            fi
          }

          copy_resource "fabric.mod.json" \
            "src/main/resources/fabric.mod.json"

          copy_resource "my-mod.mixins.json" \
            "src/main/resources/my-mod.mixins.json"

          copy_resource "en_us.json" \
            "src/main/resources/assets/mymod/lang/en_us.json"

          # Verify project structure.
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties

          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/my-mod.mixins.json

          test -n "$(find src/main/java -name '*.java' -print -quit)"

          echo "Source files prepared successfully."

      - name: Build Fabric Mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mymod-jar
          path: build/libs/*.jar
          if-no-files-found: error
